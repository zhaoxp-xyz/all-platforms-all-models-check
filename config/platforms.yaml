- name: google_gemini
  enabled: true
  protocols:
  - openai
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  auth:
    type: api_key
    api_key: REPLACE_WITH_YOUR_API_KEY
  proxy: http://192.168.31.81:8890
  concurrency: 8
  model_filters: []
  fallback_triggers:
  - '400'
  - '401'
  - '404'
  timeout: 120
  retry: 2
